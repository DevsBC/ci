name: WIF smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gcp-wif-auth

      - name: Who am I
        run: |
          gcloud auth list
          gcloud config get-value account
          gcloud projects describe satoru-co --format='value(projectId)'
