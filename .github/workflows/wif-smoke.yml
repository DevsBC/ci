name: WIF smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: gcp
        uses: ./.github/actions/gcp-wif-auth

      - uses: google-github-actions/setup-gcloud@v2

      - name: Who am I
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp.outputs.credentials_file_path }}
        run: |
          gcloud auth list
          gcloud config get-value account
          gcloud projects describe satoru-co --format='value(projectId)'
